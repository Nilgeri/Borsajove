    // GRÀFIC SVG PROPI: EVOLUCIÓ DE PREUS (BRÒKER)

    function PriceSparkAreaChart({ data, color = '#1D4ED8' }) {
      if (!data || data.length < 2) return null;

      const width = 640;
      const height = 240;
      const padLeft = 58;
      const padRight = 16;
      const padTop = 18;
      const padBottom = 26;

      const minVal = Math.min(...data);
      const maxVal = Math.max(...data);
      const range = maxVal - minVal || 1;
      const paddedMin = minVal - range * 0.12;
      const paddedMax = maxVal + range * 0.12;
      const totalRange = paddedMax - paddedMin;

      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const points = data.map((val, idx) => {
        const x = padLeft + (idx / (data.length - 1)) * chartW;
        const y = padTop + chartH - ((val - paddedMin) / totalRange) * chartH;
        return { x, y, val, idx };
      });

      const linePath = points
        .map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)
        .join(' ');

      const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${(
        padTop + chartH
      ).toFixed(1)} L ${points[0].x.toFixed(1)} ${(padTop + chartH).toFixed(1)} Z`;

      const yTicks = [0, 0.25, 0.5, 0.75, 1].map((t) => {
        const val = paddedMin + t * totalRange;
        const y = padTop + chartH - t * chartH;
        return { val, y };
      });

      const lastPoint = points[points.length - 1];

      return (
        <div className="w-full overflow-hidden">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-56 sm:h-64 select-none">
            <defs>
              <linearGradient id="borsajovePriceGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={color} stopOpacity="0.20" />
                <stop offset="100%" stopColor={color} stopOpacity="0.0" />
              </linearGradient>
            </defs>

            {yTicks.map((tick, i) => (
              <g key={i}>
                <line
                  x1={padLeft}
                  y1={tick.y}
                  x2={width - padRight}
                  y2={tick.y}
                  stroke="#E2E8F0"
                  strokeDasharray="3 3"
                  strokeWidth="1"
                />
                <text
                  x={padLeft - 8}
                  y={tick.y + 4}
                  textAnchor="end"
                  className="fill-slate-400 text-[11px] font-mono"
                >
                  {tick.val.toFixed(1)}€
                </text>
              </g>
            ))}

            {points
              .filter((_, idx) => idx === 0 || idx === Math.floor(points.length / 2) || idx === points.length - 1)
              .map((p) => (
                <text
                  key={p.idx}
                  x={p.x}
                  y={height - 6}
                  textAnchor="middle"
                  className="fill-slate-400 text-[10px] font-mono"
                >
                  S{p.idx + 1}
                </text>
              ))}

            <path d={areaPath} fill="url(#borsajovePriceGrad)" />
            <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

            <circle cx={lastPoint.x} cy={lastPoint.y} r="5.5" fill={color} fillOpacity="0.22" />
            <circle cx={lastPoint.x} cy={lastPoint.y} r="3.2" fill={color} stroke="#FFFFFF" strokeWidth="1.5" />
          </svg>
        </div>
      );
    }

    // ============================================================================
    // GRÀFIC SVG PROPI: BARRES APILADES INTERÈS COMPOST / FIRE
    // ============================================================================
    function StackedGrowthSvgChart({ data }) {
      if (!data || data.length === 0) return null;

      const width = 680;
      const height = 270;
      const padLeft = 64;
      const padRight = 18;
      const padTop = 20;
      const padBottom = 32;

      const maxTotal = Math.max(...data.map((d) => d.total), 100);
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const step = Math.max(1, Math.ceil(data.length / 18));
      const sampled = data.filter((_, idx) => idx % step === 0 || idx === data.length - 1);

      const barGap = 6;
      const barWidth = Math.max(8, (chartW - barGap * (sampled.length - 1)) / sampled.length);

      const yTicks = [0, 0.25, 0.5, 0.75, 1].map((t) => ({
        val: maxTotal * t,
        y: padTop + chartH - t * chartH
      }));

      return (
        <div className="w-full overflow-hidden">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-64 sm:h-72 select-none">
            {yTicks.map((tick, i) => (
              <g key={i}>
                <line
                  x1={padLeft}
                  y1={tick.y}
                  x2={width - padRight}
                  y2={tick.y}
                  stroke="#E2E8F0"
                  strokeDasharray="3 3"
                  strokeWidth="1"
                />
                <text
                  x={padLeft - 8}
                  y={tick.y + 4}
                  textAnchor="end"
                  className="fill-slate-400 text-[11px] font-mono"
                >
                  {tick.val >= 1000 ? `${Math.round(tick.val / 1000)}k€` : `${Math.round(tick.val)}€`}
                </text>
              </g>
            ))}

            {sampled.map((item, idx) => {
              const x = padLeft + idx * (barWidth + barGap);
              const totalH = (item.total / maxTotal) * chartH;
              const aportadoH = (item.aportado / maxTotal) * chartH;
              const interesesH = Math.max(0, totalH - aportadoH);

              const yAportado = padTop + chartH - aportadoH;
              const yIntereses = yAportado - interesesH;

              return (
                <g key={item.year}>
                  <rect
                    x={x}
                    y={yAportado}
                    width={barWidth}
                    height={aportadoH}
                    fill="#1D4ED8"
                    rx="2"
                  />
                  {interesesH > 0 && (
                    <rect
                      x={x}
                      y={yIntereses}
                      width={barWidth}
                      height={interesesH}
                      fill="#059669"
                      rx="2"
                    />
                  )}
                  <text
                    x={x + barWidth / 2}
                    y={height - 10}
                    textAnchor="middle"
                    className="fill-slate-500 text-[10px] font-mono"
                  >
                    {item.shortLabel}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    // ============================================================================

    function App() {
      const [activeSection, setActiveSection] = useState('llicons');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast((prev) => (prev?.message === message ? null : prev));
        }, 3800);
      };

      // ==========================================================================
      // ESTAT: APARTAT 'LLIÇONS' (LLISTA -> TEORIA I DEFINICIONS -> 4 PREGUNTES)
      // ==========================================================================
      const [enteredLessonId, setEnteredLessonId] = useState(null);
      const [lessonStage, setLessonStage] = useState('definitions');
      const [levelFilter, setLevelFilter] = useState('Tots');
      const [completedLessons, setCompletedLessons] = useState([]);
      const [currentQuestionStep, setCurrentQuestionStep] = useState({});
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizFinished, setQuizFinished] = useState({});

      const enteredLesson = useMemo(
        () => LESSONS_DATA.find((l) => l.id === enteredLessonId) || null,
        [enteredLessonId]
      );

      const filteredLessons = useMemo(() => {
        if (levelFilter === 'Tots') return LESSONS_DATA;
        return LESSONS_DATA.filter((l) => l.level === levelFilter);
      }, [levelFilter]);

      const handleEnterLesson = (lessonId, initialStage = 'definitions') => {
        setEnteredLessonId(lessonId);
        setLessonStage(initialStage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleExitLessonToList = () => {
        setEnteredLessonId(null);
        setLessonStage('definitions');
      };

      const handleAnswerQuestion = (lesson, qIdx, optIdx) => {
        const currentAns = quizAnswers[lesson.id] || {};
        if (currentAns[qIdx] !== undefined) return;

        const updatedAnswers = {
          ...currentAns,
          [qIdx]: optIdx
        };

        setQuizAnswers((prev) => ({
          ...prev,
          [lesson.id]: updatedAnswers
        }));

        if (Object.keys(updatedAnswers).length === lesson.quiz.length) {
          setQuizFinished((prev) => ({ ...prev, [lesson.id]: true }));
          const score = lesson.quiz.reduce(
            (acc, q, idx) => acc + (updatedAnswers[idx] === q.correctIndex ? 1 : 0),
            0
          );

          if (score >= 3) {
            if (!completedLessons.includes(lesson.id)) {
              setCompletedLessons((prev) => [...prev, lesson.id]);
              showToast(
                `Tema superat (${score}/4)! Has desbloquejat "${lesson.badge}".`,
                'success'
              );
            } else {
              showToast(`Excel·lent! Has obtingut ${score} de 4 encerts.`, 'success');
            }
          } else {
            showToast(
              `Has obtingut ${score}/4. Necessites almenys 3 encerts per superar el tema.`,
              'warning'
            );
          }
        }
      };

      const handleResetLessonQuiz = (lessonId) => {
        setQuizAnswers((prev) => ({ ...prev, [lessonId]: {} }));
        setQuizFinished((prev) => ({ ...prev, [lessonId]: false }));
        setCurrentQuestionStep((prev) => ({ ...prev, [lessonId]: 0 }));
      };

      // ==========================================================================
      // ESTAT: APARTAT 'BRÒKER' (10.000,00 € INICIALS)
      // ==========================================================================
      const [assets, setAssets] = useState(INITIAL_ASSETS);
      const [selectedSymbol, setSelectedSymbol] = useState('IWDA');
      const [isMarketLive, setIsMarketLive] = useState(true);
      const [marketTickCount, setMarketTickCount] = useState(12);
      const [cashBalance, setCashBalance] = useState(10000);
      const [portfolio, setPortfolio] = useState({});
      const [transactions, setTransactions] = useState([]);

      const [orderSide, setOrderSide] = useState('BUY');
      const [orderMode, setOrderMode] = useState('EUR');
      const [orderInput, setOrderInput] = useState('1000');

      const advanceMarketTick = () => {
        setMarketTickCount((c) => c + 1);
        setAssets((prevAssets) =>
          prevAssets.map((asset) => {
            const randomShock = (Math.random() - 0.49) * 2;
            const pctChange = asset.drift + asset.volatility * randomShock;
            const newPrice = Math.max(1, Number((asset.price * (1 + pctChange)).toFixed(2)));
            const updatedHistory = [...asset.history.slice(-23), newPrice];
            return {
              ...asset,
              price: newPrice,
              history: updatedHistory
            };
          })
        );
      };

      useEffect(() => {
        if (!isMarketLive) return;
        const interval = setInterval(() => {
          advanceMarketTick();
        }, 2500);
        return () => clearInterval(interval);
      }, [isMarketLive]);

      const selectedAsset = useMemo(
        () => assets.find((a) => a.symbol === selectedSymbol) || assets[0],
        [assets, selectedSymbol]
      );

      const portfolioStats = useMemo(() => {
        let holdingsValue = 0;
        const positionsList = [];

        Object.entries(portfolio).forEach(([symbol, pos]) => {
          if (pos.shares > 0.000001) {
            const assetInfo = assets.find((a) => a.symbol === symbol);
            const currentPrice = assetInfo ? assetInfo.price : pos.avgPrice;
            const currentValue = pos.shares * currentPrice;
            const costBasis = pos.shares * pos.avgPrice;
            const pnl = currentValue - costBasis;
            const pnlPct = costBasis > 0 ? (pnl / costBasis) * 100 : 0;

            holdingsValue += currentValue;

            positionsList.push({
              symbol,
              name: assetInfo?.name || symbol,
              category: assetInfo?.category || '',
              shares: pos.shares,
              avgPrice: pos.avgPrice,
              currentPrice,
              currentValue,
              pnl,
              pnlPct
            });
          }
        });

        const totalEquity = cashBalance + holdingsValue;
        const totalReturn = totalEquity - 10000;
        const totalReturnPct = (totalReturn / 10000) * 100;

        return {
          holdingsValue,
          totalEquity,
          totalReturn,
          totalReturnPct,
          positionsList
        };
      }, [portfolio, assets, cashBalance]);

      const orderPreview = useMemo(() => {
        const val = parseFloat(orderInput) || 0;
        if (val <= 0) return { shares: 0, totalEur: 0 };
        if (orderMode === 'EUR') {
          return {
            totalEur: val,
            shares: val / selectedAsset.price
          };
        } else {
          return {
            shares: val,
            totalEur: val * selectedAsset.price
          };
        }
      }, [orderInput, orderMode, selectedAsset.price]);

      const handleExecuteOrder = () => {
        const { shares, totalEur } = orderPreview;
        if (shares <= 0 || totalEur <= 0) {
          showToast('Introdueix un import o quantitat vàlida superior a 0.', 'warning');
          return;
        }

        if (orderSide === 'BUY') {
          if (totalEur > cashBalance + 0.01) {
            showToast('Saldo en efectiu insuficient per executar aquesta compra.', 'error');
            return;
          }

          const existing = portfolio[selectedAsset.symbol] || { shares: 0, avgPrice: 0 };
          const newTotalShares = existing.shares + shares;
          const newAvgPrice =
            (existing.shares * existing.avgPrice + shares * selectedAsset.price) / newTotalShares;

          setCashBalance((prev) => Math.max(0, prev - totalEur));
          setPortfolio((prev) => ({
            ...prev,
            [selectedAsset.symbol]: {
              shares: newTotalShares,
              avgPrice: newAvgPrice
            }
          }));

          setTransactions((prev) => [
            {
              id: Date.now(),
              time: new Date().toLocaleTimeString('ca-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              }),
              type: 'COMPRA',
              symbol: selectedAsset.symbol,
              shares,
              price: selectedAsset.price,
              total: totalEur
            },
            ...prev
          ]);

          showToast(
            `Compra executada: ${shares.toFixed(4)} ${selectedAsset.symbol} per ${formatEUR(totalEur)}`,
            'success'
          );
        } else {
          const existing = portfolio[selectedAsset.symbol];
          if (!existing || existing.shares < shares - 0.0001) {
            showToast(
              `No disposes de prou títols de ${selectedAsset.symbol} per vendre aquesta quantitat.`,
              'error'
            );
            return;
          }

          const actualSharesSold = Math.min(existing.shares, shares);
          const actualEurReceived = actualSharesSold * selectedAsset.price;
          const remainingShares = existing.shares - actualSharesSold;

          setCashBalance((prev) => prev + actualEurReceived);
          setPortfolio((prev) => {
            const updated = { ...prev };
            if (remainingShares <= 0.00001) {
              delete updated[selectedAsset.symbol];
            } else {
              updated[selectedAsset.symbol] = {
                ...existing,
                shares: remainingShares
              };
            }
            return updated;
          });

          setTransactions((prev) => [
            {
              id: Date.now(),
              time: new Date().toLocaleTimeString('ca-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              }),
              type: 'VENDA',
              symbol: selectedAsset.symbol,
              shares: actualSharesSold,
              price: selectedAsset.price,
              total: actualEurReceived
            },
            ...prev

          showToast(

        const P = Math.max(0, Number(ciInitial) || 0);
        const PMT = Math.max(0, Number(ciMonthly) || 0);
        const nominalRate = Math.max(0, Number(ciRate) || 0) / 100;
        const inflRate = ciAdjustInflation ? Math.max(0, Number(ciInflationRate) || 0) / 100 : 0;
        const effectiveAnnualRate = ciAdjustInflation
          ? (1 + nominalRate) / (1 + inflRate) - 1
          : nominalRate;
        const years = Math.min(45, Math.max(1, Number(ciYears) || 1));

        const yearlyData = [];
        let currentBalance = P;
        let totalContributed = P;

        yearlyData.push({
          year: 'Any 0',
          shortLabel: '0',
          aportado: Math.round(totalContributed),
          intereses: 0,
          total: Math.round(currentBalance)
        });

        const monthlyRate = Math.pow(1 + effectiveAnnualRate, 1 / 12) - 1;

        for (let y = 1; y <= years; y++) {
          for (let m = 1; m <= 12; m++) {
            currentBalance = (currentBalance + PMT) * (1 + monthlyRate);
            totalContributed += PMT;
          }

          const interestEarned = Math.max(0, currentBalance - totalContributed);
          yearlyData.push({
            year: `Any ${y}`,
            shortLabel: `${y}`,
            aportado: Math.round(totalContributed),
            intereses: Math.round(interestEarned),
            total: Math.round(currentBalance)
          });
        }

        const finalEntry = yearlyData[yearlyData.length - 1];
        return {
          finalBalance: finalEntry.total,
          totalContributed: finalEntry.aportado,
          totalInterest: finalEntry.intereses,
          yearlyData
        };

                          </thead>
                          <tbody className="divide-y divide-slate-100 text-sm">
                            {portfolioStats.positionsList.map((pos) => (
                              <tr
                                key={pos.symbol}
                                onClick={() => setSelectedSymbol(pos.symbol)}
                                className="hover:bg-slate-50 cursor-pointer transition-colors"
                              >
                                <td className="py-3">
                                  <div className="font-bold text-slate-900">{pos.symbol}</div>
                                  <div className="text-xs text-slate-500">{pos.name}</div>
                                </td>
                                <td className="py-3 text-right font-mono text-slate-700">
                                  {pos.shares.toFixed(4)}
                                </td>
                                <td className="py-3 text-right font-mono text-slate-600">
                                  {formatEUR(pos.avgPrice)}
                                </td>
                                <td className="py-3 text-right font-mono font-bold text-slate-900">
                                  {formatEUR(pos.currentValue)}
                                </td>
                                <td
                                  className={`py-3 text-right font-mono font-bold ${
                                    pos.pnl >= 0 ? 'text-emerald-600' : 'text-rose-600'
                                  }`}
                                >
                                  <div>
                                    {pos.pnl >= 0 ? '+' : ''}
                                    {formatEUR(pos.pnl)}
                                  </div>
                                  <div className="text-xs">
                                    ({pos.pnlPct >= 0 ? '+' : ''}
                                    {pos.pnlPct.toFixed(2)}%)
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>

                  <div className="lg:col-span-5 bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-slate-900 flex items-center gap-2">
                        <History className="w-4 h-4 text-amber-600" />
                        Historial d'Operacions
                      </h3>
                      <span className="text-xs text-slate-500">{transactions.length} ordres</span>
                    </div>

                    {transactions.length === 0 ? (
                      <div className="text-center py-10 px-4 border border-dashed border-slate-200 rounded-xl bg-[#FAF9F6]">
                        <p className="text-slate-600 text-sm font-medium">Cap operació registrada.</p>
                        <p className="text-slate-400 text-xs mt-1">
                          Aquí apareixeran les teves compres i vendes executades.
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-2.5 max-h-[280px] overflow-y-auto pr-1">
                        {transactions.map((tx) => (
                          <div
                            key={tx.id}
                            className="flex items-center justify-between p-3 rounded-xl bg-[#FAF9F6] border border-slate-200/80 text-xs"
                          >
                            <div className="flex items-center gap-2.5">
                              <span
                                className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                  tx.type === 'COMPRA'
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : 'bg-rose-100 text-rose-800'
                                }`}
                              >
                                {tx.type}
                              </span>
                              <div>
                                <div className="font-bold text-slate-900">
                                  {tx.shares.toFixed(4)} {tx.symbol}
                                </div>
                                <div className="text-slate-500">
                                  @ {formatEUR(tx.price)} · {tx.time}
                                </div>
                              </div>
                            </div>
                            <div className="font-mono font-bold text-slate-900">
                              {formatEUR(tx.total)}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ====================================================================
                APARTAT 3: CALCULADORA FINANCERA (NOMÉS INTERÈS COMPOST)
            ==================================================================== */}
            {activeSection === 'calculadora' && (
              <div className="space-y-6">
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                  <div className="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#1D4ED8]">
                    <Calculator className="w-3.5 h-3.5" />
                    Planificació Financera
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mt-1">
                    Calculadora d’Interès Compost
                  </h1>
                  <p className="text-sm text-slate-500 mt-1">
                    Simula com creix el teu capital a llarg termini combinant aportacions periòdiques i la reinversió dels interessos.
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-4 bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-5">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">Paràmetres d'Estalvi</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Ajusta les variables per projectar l’evolució de la teva inversió.
                      </p>
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                        <span>Capital Inicial</span>
                        <span className="font-mono text-[#1D4ED8]">{formatEUR(ciInitial, 0)}</span>
                      </label>
                      <input
                        type="number"
                        min="0"
                        step="500"
                        value={ciInitial}
                        onChange={(e) => setCiInitial(Number(e.target.value))}
                        className="w-full bg-[#FAF9F6] border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-900 font-mono text-sm font-semibold"
                      />
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                        <span>Aportació Mensual</span>
                        <span className="font-mono text-[#1D4ED8]">
                          {formatEUR(ciMonthly, 0)}/mes
                        </span>
                      </label>
                      <input
                        type="number"
                        min="0"
                        step="50"
                        value={ciMonthly}
                        onChange={(e) => setCiMonthly(Number(e.target.value))}
                        className="w-full bg-[#FAF9F6] border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-900 font-mono text-sm font-semibold"
                      />
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                        <span>Rendibilitat Anual (%)</span>
                        <span className="font-mono text-[#1D4ED8]">{ciRate}%</span>
                      </label>
                      <input
                        type="range"
                        min="1"
                        max="16"
                        step="0.5"
                        value={ciRate}
                        onChange={(e) => setCiRate(Number(e.target.value))}
                        className="w-full accent-[#1D4ED8]"
                      />
                    </div>

                    <div>
                      <label className="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                        <span>Horitzó Temporal (Anys)</span>
                        <span className="font-mono text-[#1D4ED8]">{ciYears} anys</span>
                      </label>
                      <input
                        type="range"
                        min="1"
                        max="40"
                        step="1"
                        value={ciYears}
                        onChange={(e) => setCiYears(Number(e.target.value))}
                        className="w-full accent-[#1D4ED8]"
                      />
                    </div>

                    <div className="pt-2 border-t border-slate-200 space-y-3">
                      <label className="flex items-center justify-between cursor-pointer">
                        <span className="text-xs font-semibold text-slate-700">
                          Ajustar per inflació
                        </span>
                        <input
                          type="checkbox"
                          checked={ciAdjustInflation}
                          onChange={(e) => setCiAdjustInflation(e.target.checked)}
                          className="w-4 h-4 accent-[#1D4ED8] rounded"
                        />
                      </label>
                      {ciAdjustInflation && (
                        <div>
                          <label className="flex justify-between text-xs text-slate-500 mb-1">
                            <span>Inflació anual estimada (%)</span>
                            <span className="font-mono font-bold text-amber-700">
                              {ciInflationRate}%
                            </span>
                          </label>
                          <input
                            type="range"
                            min="0.5"
                            max="7"
                            step="0.5"
                            value={ciInflationRate}
                            onChange={(e) => setCiInflationRate(Number(e.target.value))}
                            className="w-full accent-amber-600"
                          />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="lg:col-span-8 space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="bg-white border border-blue-200 rounded-2xl p-4 shadow-xs">
                        <span className="text-xs font-semibold text-slate-500">
                          {ciAdjustInflation
                            ? 'Capital Final (Poder Compra Avui)'
                            : 'Capital Final Acumulat'}
                        </span>
                        <div className="text-2xl font-bold text-[#1D4ED8] font-mono mt-1">
                          {formatEUR(compoundResults.finalBalance, 0)}
                        </div>
                      </div>

                      <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs">
                        <span className="text-xs font-semibold text-slate-500">Capital Aportat</span>
                        <div className="text-2xl font-bold text-slate-900 font-mono mt-1">
                          {formatEUR(compoundResults.totalContributed, 0)}
                        </div>
                      </div>

                      <div className="bg-white border border-emerald-200 rounded-2xl p-4 shadow-xs">
                        <span className="text-xs font-semibold text-slate-500">
                          Interessos Generats
                        </span>
                        <div className="text-2xl font-bold text-emerald-600 font-mono mt-1">
                          +{formatEUR(compoundResults.totalInterest, 0)}
                        </div>
                      </div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <h3 className="text-sm font-bold text-slate-900">
                          Evolució Anual: Capital Aportat vs. Interessos
                        </h3>
                        <div className="flex items-center gap-4 text-xs">
                          <span className="flex items-center gap-1.5 text-slate-600">
                            <span className="w-3 h-3 rounded-xs bg-[#1D4ED8]" /> Capital Aportat
                          </span>
                          <span className="flex items-center gap-1.5 text-slate-600">
                            <span className="w-3 h-3 rounded-xs bg-emerald-600" /> Interessos
                          </span>
                        </div>
                      </div>

                      <StackedGrowthSvgChart data={compoundResults.yearlyData} />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ====================================================================
                APARTAT 4: PERFIL
            ==================================================================== */}
            {activeSection === 'perfil' && (
              <div className="space-y-6">
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs flex items-center justify-between gap-6">
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 rounded-2xl bg-blue-50 border border-blue-200 flex items-center justify-center text-[#1D4ED8] font-bold text-2xl shrink-0">
                      {userName.charAt(0).toUpperCase()}
                    </div>

                    <div className="space-y-1.5">
                      {isEditingName ? (
                        <div className="flex items-center gap-2">
                          <input
                            type="text"
                            value={tempUserName}
                            onChange={(e) => setTempUserName(e.target.value)}
                            className="bg-[#FAF9F6] border border-slate-300 rounded-xl px-3 py-1.5 text-slate-900 font-bold text-lg focus:outline-none focus:border-[#1D4ED8]"
                          />
                          <button
                            onClick={handleSaveUserName}
                            className="p-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700"
                            aria-label="Desar nom"
                          >
                            <Check className="w-4 h-4" />
                          </button>
                        </div>
                      ) : (
                        <div className="flex items-center gap-2">
                          <h1 className="text-2xl font-bold text-slate-900">{userName}</h1>
                          <button
                            onClick={() => {
                              setTempUserName(userName);
                              setIsEditingName(true);
                            }}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-[#1D4ED8] hover:bg-slate-100"
                            aria-label="Editar nom"
                          >
                            <Edit3 className="w-4 h-4" />
                          </button>
                        </div>
                      )}

                      <div className="flex flex-wrap items-center gap-2">
                        <span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-[#1D4ED8] border border-blue-200/70">
                          <Trophy className="w-3.5 h-3.5" />
                          Nivell {userXpStats.level} · {userXpStats.rankTitle}
                        </span>
                        <span className="text-xs font-mono font-semibold text-slate-500">
                          {userXpStats.totalXp} XP acumulats
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-7 space-y-6">
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-4">
                      <div className="flex items-center justify-between">
                        <h2 className="font-bold text-slate-900 text-base flex items-center gap-2">
                          <BookOpen className="w-4 h-4 text-[#1D4ED8]" />
                          Progrés a les Lliçons
                        </h2>
                        <span className="text-xs font-mono font-bold text-[#1D4ED8]">
                          {completedLessons.length}/{LESSONS_DATA.length} temes · {totalCorrectAnswers}/20 encerts
                        </span>
                      </div>

                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div
                          style={{
                            width: `${(completedLessons.length / LESSONS_DATA.length) * 100}%`
                          }}
                          className="h-full bg-[#1D4ED8] transition-all duration-500"
                        />
                      </div>

                      <div className="space-y-2.5 pt-2">
                        {LESSONS_DATA.map((lesson) => {
                          const isDone = completedLessons.includes(lesson.id);
                          const ans = quizAnswers[lesson.id] || {};
                          const score = lesson.quiz.reduce(
                            (acc, q, idx) => acc + (ans[idx] === q.correctIndex ? 1 : 0),
                            0
                          );

                          return (
                            <div
                              key={lesson.id}
                              className="flex items-center justify-between p-3.5 rounded-xl bg-[#FAF9F6] border border-slate-200/80"
                            >
                              <div className="min-w-0 pr-3">
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-mono font-bold text-slate-400">
                                    {lesson.number}
                                  </span>
                                  <span className="text-sm font-bold text-slate-900 truncate">
                                    {lesson.title}
                                  </span>
                                </div>
                              </div>

                              <div className="flex items-center gap-3 shrink-0">
                                <span className="text-xs font-mono font-semibold text-slate-600">
                                  {score}/4
                                </span>
                                {isDone ? (
                                  <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                    <CheckCircle2 className="w-3 h-3" /> Superat
                                  </span>
                                ) : (
                                  <button
                                    onClick={() => {
                                      setActiveSection('llicons');
                                      handleEnterLesson(lesson.id, 'definitions');
                                    }}
                                    className="text-xs font-bold text-[#1D4ED8] hover:underline"
                                  >
                                    Estudiar →
                                  </button>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-4">
                      <div className="flex items-center justify-between">
                        <h2 className="font-bold text-slate-900 text-base flex items-center gap-2">
                          <Award className="w-4 h-4 text-amber-600" />
                          Insígnies i Assoliments
                        </h2>
                        <span className="text-xs text-slate-500">
                          {completedLessons.length} de {LESSONS_DATA.length} desbloquejades
                        </span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {LESSONS_DATA.map((lesson) => {
                          const unlocked = completedLessons.includes(lesson.id);
                          return (
                            <div
                              key={lesson.id}
                              className={`p-4 rounded-xl border flex items-center gap-3 ${
                                unlocked
                                  ? 'bg-amber-50/60 border-amber-200 text-slate-900'
                                  : 'bg-slate-50 border-slate-200/70 text-slate-400 opacity-75'
                              }`}
                            >
                              <div
                                className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                                  unlocked
                                    ? 'bg-amber-100 text-amber-700'
                                    : 'bg-slate-200/70 text-slate-400'
                                }`}
                              >
                                <Award className="w-5 h-5" />
                              </div>
                              <div>
                                <div className="font-bold text-sm">{lesson.badge}</div>
                                <div className="text-xs">
                                  {unlocked ? 'Desbloquejada' : `Supera el Tema ${lesson.number} (3/4)`}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-5 space-y-6">
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-4">
                      <div className="flex items-center justify-between">
                        <h2 className="font-bold text-slate-900 text-base flex items-center gap-2">
                          <Wallet className="w-4 h-4 text-emerald-600" />
                          Resum de la Cartera Virtual
                        </h2>
                        <button
                          onClick={() => setActiveSection('broker')}
                          className="text-xs font-bold text-[#1D4ED8] hover:underline"
                        >
                          Anar al Bròker →
                        </button>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="p-3.5 rounded-xl bg-[#FAF9F6] border border-slate-200">
                          <span className="text-[11px] text-slate-500 font-semibold">
                            Patrimoni Total
                          </span>
                          <div className="text-lg font-bold font-mono text-slate-900 mt-0.5">
                            {formatEUR(portfolioStats.totalEquity)}
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-[#FAF9F6] border border-slate-200">
                          <span className="text-[11px] text-slate-500 font-semibold">
                            Rendibilitat Global
                          </span>
                          <div
                            className={`text-lg font-bold font-mono mt-0.5 ${
                              portfolioStats.totalReturn >= 0 ? 'text-emerald-600' : 'text-rose-600'
                            }`}
                          >
                            {portfolioStats.totalReturn >= 0 ? '+' : ''}
                            {portfolioStats.totalReturnPct.toFixed(2)}%
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-[#FAF9F6] border border-slate-200">
                          <span className="text-[11px] text-slate-500 font-semibold">
                            Capital Invertit
                          </span>
                          <div className="text-base font-bold font-mono text-slate-900 mt-0.5">
                            {formatEUR(portfolioStats.holdingsValue)}
                          </div>
                        </div>

                        <div className="p-3.5 rounded-xl bg-[#FAF9F6] border border-slate-200">
                          <span className="text-[11px] text-slate-500 font-semibold">
                            Ordres Executades
                          </span>
                          <div className="text-base font-bold font-mono text-slate-900 mt-0.5">
                            {transactions.length}
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-4">
                      <h2 className="font-bold text-slate-900 text-base flex items-center gap-2">
                        <Sliders className="w-4 h-4 text-slate-600" />
                        Gestió del Compte i Progrés
                      </h2>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Si vols començar de zero l’itinerari de lliçons i restaurar el saldo virtual de
                        10.000,00 € al simulador de bròker, pots reiniciar totes les dades.
                      </p>

                      <button
                        onClick={() => setConfirmResetAllModal(true)}
                        className="w-full py-3 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold flex items-center justify-center gap-2 transition-colors"
                      >
                        <RotateCcw className="w-4 h-4" />
                        Reiniciar progrés i compte virtual
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* BARRA DE NAVEGACIÓ INFERIOR MÒBIL */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 px-2 py-1.5 grid grid-cols-4 gap-1 shadow-lg">
            {NAV_ITEMS.map((item) => {
              const IconComp = item.icon;
              const isActive = activeSection === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveSection(item.id)}
                  className={`flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-bold transition-colors ${
                    isActive ? 'text-[#1D4ED8] bg-blue-50/80' : 'text-slate-500'
                  }`}
                >
                  <IconComp className="w-4 h-4 mb-0.5" />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>

          {/* PEU DE PÀGINA */}
          <footer className="border-t border-slate-200 bg-white py-5 px-4 text-center text-xs text-slate-500">
            <p>
              <strong>BorsaJove</strong> · Plataforma d’educació financera i simulació de carteres. Contingut exclusivament formatiu.
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
